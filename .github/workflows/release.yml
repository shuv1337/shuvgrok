name: Release

# Builds the six platform binaries, publishes the ShuvGrok npm packages
# (@shuv1337/shuvgrok + @shuv1337/shuvgrok-<platform>-<arch>), cuts the GitHub
# release, and announces it on Discord.
#
# Driven by scripts/release.mjs, which bumps the version in Cargo.toml +
# the npm package.json files, commits, tags vX.Y.Z, and pushes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.4)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string
      dry_run:
        description: 'Build and package only: skip npm publish, the GitHub release, and Discord'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: shuvgrok-darwin-arm64
            bin: xai-grok-pager
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: shuvgrok-darwin-x64
            bin: xai-grok-pager
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shuvgrok-linux-x64
            bin: xai-grok-pager
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shuvgrok-linux-arm64
            bin: xai-grok-pager
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: shuvgrok-win32-x64
            bin: xai-grok-pager.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: shuvgrok-win32-arm64
            bin: xai-grok-pager.exe
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          # build.rs shells out to `git rev-parse --short HEAD` for the commit
          # stamp, so the checkout must keep its git metadata.
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Setup cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      # Proto codegen resolves protoc from $PROTOC, then bin/protoc, then PATH.
      # bin/protoc is a DotSlash stub, so with no DotSlash on the runner the
      # build panics in xai-grok-tools-api's build script.
      #
      # This fetches the same protoc release bin/protoc pins (29.3) and sets
      # $PROTOC, the first branch the build checks. Chosen over installing
      # DotSlash because its stub is a `#!/usr/bin/env dotslash` shebang, which
      # does not execute on Windows, and over an unpinned protoc because codegen
      # should not drift between CI and a local DotSlash build.
      #
      # Selection is by RUNNER arch, not matrix.target: protoc runs on the host
      # even when cross-compiling.
      - name: Install protoc
        shell: bash
        env:
          PROTOC_VERSION: '29.3'
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)    asset="linux-x86_64" ;;
            Linux-ARM64)  asset="linux-aarch_64" ;;
            macOS-ARM64)  asset="osx-aarch_64" ;;
            macOS-X64)    asset="osx-x86_64" ;;
            Windows-X64)  asset="win64" ;;
            *) echo "no pinned protoc for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac

          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip"
          dest="${RUNNER_TEMP}/protoc"
          mkdir -p "${dest}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/protoc.zip" "${url}"

          # GNU tar cannot read zip; bsdtar (macOS/Windows) can, and unzip is
          # present on the Linux images.
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "${RUNNER_TEMP}/protoc.zip" -d "${dest}"
          else
            tar -xf "${RUNNER_TEMP}/protoc.zip" -C "${dest}"
          fi

          exe="${dest}/bin/protoc"
          [ "${RUNNER_OS}" = "Windows" ] && exe="${exe}.exe"
          chmod +x "${exe}" || true
          "${exe}" --version
          echo "PROTOC=${exe}" >> "${GITHUB_ENV}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: ${{ matrix.target }}

      # The tools build script embeds ripgrep (and fd) into the binary,
      # downloading each from GitHub releases per target. Six unauthenticated
      # fetches per release is how v1.0.5 died on a 403. Cached verified
      # tarballs make the steady state need no network at all; the key covers
      # the pinned versions, which live in build.rs.
      - name: Cache bundled tool assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-tool-assets
          key: tool-assets-${{ matrix.target }}-${{ hashFiles('crates/codegen/xai-grok-tools/build.rs') }}

      - name: Build
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GROK_TOOLS_ASSET_CACHE: ${{ runner.temp }}/grok-tool-assets
          # Raises the GitHub rate-limit ceiling on a cache miss. Dropped by
          # reqwest on the cross-host redirect to the asset CDN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # build.rs reads GROK_VERSION. Without it the binary reports the
          # crate version and behaves as a DEV BUILD — notably folder trust
          # auto-trusts every directory. Never drop this.
          export GROK_VERSION="${TAG#v}"
          echo "Building ${{ matrix.target }} as GROK_VERSION=${GROK_VERSION}"
          cargo build --release \
            -p xai-grok-pager-bin \
            --bin xai-grok-pager \
            --target "${{ matrix.target }}"

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: publish npm
    runs-on: ubuntu-latest
    needs:
      - build
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
      NPM_DIR: crates/codegen/xai-grok-pager/npm
      # brotliCompress runs on the libuv thread pool; six targets compress in
      # parallel only if the pool is at least six wide.
      UV_THREADPOOL_SIZE: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Gate publishing on the launcher's own suite. It covers the versioned
      # symlink logic in postinstall.js and the bin/shuvgrok trampoline, and
      # nothing ran it before — which is how a trampoline that kept exec'ing
      # the previous version after an upgrade reached users.
      - name: Test npm launcher
        run: node scripts/test-postinstall.js
        working-directory: crates/codegen/xai-grok-pager/npm/shuvgrok

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          meta_version="$(node -p "require('./${NPM_DIR}/shuvgrok/package.json').version")"
          if [ "${version}" != "${meta_version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match @shuv1337/shuvgrok version ${meta_version}" >&2
            exit 1
          fi

      - name: Assemble platform packages
        shell: bash
        env:
          # Source paths for scripts/assemble-platform-packages.js. These env
          # var names are part of the kept-compatibility surface; do not
          # rename them to SHUVGROK_*.
          GROK_DARWIN_ARM64: ${{ github.workspace }}/artifacts/shuvgrok-darwin-arm64/xai-grok-pager
          GROK_DARWIN_X64: ${{ github.workspace }}/artifacts/shuvgrok-darwin-x64/xai-grok-pager
          GROK_LINUX_X64: ${{ github.workspace }}/artifacts/shuvgrok-linux-x64/xai-grok-pager
          GROK_LINUX_ARM64: ${{ github.workspace }}/artifacts/shuvgrok-linux-arm64/xai-grok-pager
          GROK_WIN32_X64: ${{ github.workspace }}/artifacts/shuvgrok-win32-x64/xai-grok-pager.exe
          GROK_WIN32_ARM64: ${{ github.workspace }}/artifacts/shuvgrok-win32-arm64/xai-grok-pager.exe
        run: node scripts/assemble-platform-packages.js
        working-directory: crates/codegen/xai-grok-pager/npm/shuvgrok

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node scripts/publish-npm.mjs

      - name: Validate packaging only (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: node scripts/publish-npm.mjs --dry-run

  publish-github-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs:
      - publish-npm
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # No CHANGELOG.md in this repo: let GitHub generate notes from commits.

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --draft=false
            exit 0
          fi

          # Pass a target commitish ONLY when the tag does not already exist.
          #
          # This repo is a fork, and GitHub refuses release creation on a fork
          # with an explicit target_commitish — HTTP 403 "Resource not
          # accessible by integration", even though the job is granted
          # contents: write and the log confirms it. That is what broke v1.0.5.
          # v1.0.4 escaped only because the tag and the branch head were then
          # the same commit.
          #
          # The tag-push trigger means the tag already exists and already pins
          # the commit, so the target was redundant on the normal path. It is
          # still needed for a workflow_dispatch naming a tag that has not been
          # created yet.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --target "$(git rev-parse HEAD)"
          fi

      # Floating pointer at the last successful publish. Kept in CI (not
      # scripts/release.mjs) so a failed npm/GitHub publish cannot steal it.
      # Lightweight, force-moved: git fetch origin tag latest.
      - name: Point latest tag at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Pointing refs/tags/latest at ${sha} (${RELEASE_TAG})"
          if gh api "repos/${GH_REPO}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/latest" \
              -f sha="${sha}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/latest" -f sha="${sha}" >/dev/null
          fi

  notify-discord:
    name: notify discord
    runs-on: ubuntu-latest
    needs:
      - publish-github-release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - id: release
        name: Load release details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          name="$(gh release view "$TAG" --repo "$GH_REPO" --json name --jq .name)"
          url="$(gh release view "$TAG" --repo "$GH_REPO" --json url --jq .url)"
          delimiter="release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "name=$name"
            echo "url=$url"
            echo "body<<$delimiter"
            gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post release notes to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
          username: shuvgrok releases
          reduce_headings: true
